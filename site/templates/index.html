<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ config.description }}">
    <title>{{ section.title }} | {{ config.title }}</title>

    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
        line-height: 1.65;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.1;
      }
    </style>
  </head>

  <body>
    <main>
      <h1 id="primes">{{ section.title }}</h1>
      {{ section.content | safe }}
    </main>

    <script type="module">
      import init, { randomConsecutivePrimes } from "{{ get_url(path='wasm/hello_core.js') }}";

      async function run() {
        await init();
        const [first, second] = randomConsecutivePrimes();
        document.getElementById("primes").textContent =
          `Today's prime numbers are ${first} and ${second}`;
      }

      run();
    </script>
  </body>
</html>
